<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Wallet</title>
<meta name="theme-color" content="#f2f7ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cat Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f7ee; --card:#e4eeda; --paper:#fbfcf8; --ink:#2f5a40; --ink2:#7a9684;
  --accent:#5b8f6b; --line:#d5e3cc; --pill:#d4ecd9; --pillink:#2e8b57; --chip:#e4eeda; --danger:#c0564b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:520px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px)}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:4px 2px 14px}
.logo{width:54px;height:54px;border-radius:18px;background:var(--card);display:grid;place-items:center;font-size:32px;color:var(--ink);flex:none}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.3px}
.titles p{margin:3px 0 0;font-size:14px;color:var(--ink2)}
.round{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;flex:none}
.round:active{transform:scale(.94)}
.round[disabled]{opacity:.4;cursor:default}

/* search */
.searchbar{display:none;margin:0 0 14px;position:relative}
.searchbar.open{display:block}
.searchbar input{width:100%;height:46px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);
  padding:0 16px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.searchbar input:focus{border-color:var(--accent)}

/* month summary */
.summary{background:var(--card);border-radius:30px;padding:14px}
.monthrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthrow .round{background:var(--paper);width:44px;height:44px;font-size:20px}
.monthtxt{text-align:center;flex:1}
.monthtxt small{display:block;font-size:13px;letter-spacing:.8px;color:var(--ink2);text-transform:uppercase}
.monthtxt b{display:block;font-size:24px;margin-top:2px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tot{background:var(--paper);border-radius:24px;padding:16px 14px;min-width:0}
.tot .lbl{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px}
.tot .lbl .ic{font-size:18px}
.tot .val{margin-top:14px;font-size:clamp(20px,6vw,28px);font-weight:700;overflow-wrap:anywhere;line-height:1.1}

/* list */
.histhead{display:flex;align-items:flex-start;justify-content:space-between;margin:24px 2px 8px;gap:8px}
.histhead h2{margin:0;font-size:24px;font-weight:700}
.histhead p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.count{background:var(--pill);color:var(--pillink);font-size:13px;padding:6px 12px;border-radius:99px;white-space:nowrap;margin-top:4px}
.day{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.day .d{background:var(--card);padding:8px 14px;border-radius:99px;font-size:15px;font-weight:600}
.day .w{font-size:15px;font-weight:600}
.day .ln{flex:1;height:2px;background:var(--line);border-radius:2px}
.group{background:var(--paper);border-radius:28px;padding:4px 16px}
.row{display:flex;align-items:center;gap:14px;padding:16px 0;width:100%;text-align:left}
.row + .row{border-top:1.5px solid var(--line)}
.row:active{opacity:.7}
.cico{width:52px;height:52px;border-radius:18px;background:var(--card);display:grid;place-items:center;font-size:26px;flex:none}
.info{flex:1;min-width:0}
.info .t{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .m{font-size:14px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .p{font-size:13px;color:var(--ink2);margin-top:5px;opacity:.85}
.amt{font-size:18px;font-weight:700;white-space:nowrap}

.empty{text-align:center;color:var(--ink2);padding:48px 12px}
.empty .big{font-size:42px;color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.empty .big .ic{width:1em;height:1em}

.foot{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px 0 8px;color:var(--ink2);font-size:15px;text-align:center}
.foot .ic{font-size:18px;flex:none}
.rate{display:block;width:100%;text-align:center;color:var(--ink2);font-size:13.5px;padding:8px;margin-top:6px}

/* FAB */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 64px);
  right:max(16px, calc(50% - 260px + 16px));
  width:68px;height:68px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:32px;
  box-shadow:0 8px 20px rgba(60,100,75,.35);z-index:5}
.fab:active{transform:scale(.94)}
.fab .ic{stroke-width:2.4}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(35,60,45,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:var(--bg);border-radius:32px 32px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  max-height:94dvh;overflow-y:auto;z-index:11;overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:22px}
.amtbox{background:var(--paper);border-radius:24px;padding:14px 16px}
.amtbox label{font-size:13px;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase}
.amtline{display:flex;align-items:center;gap:6px;margin-top:4px}
.amtline span{font-size:32px;font-weight:700}
.amtline input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:32px;font-weight:700;color:var(--ink)}
.amtline input::placeholder{color:#b9cdbf}
.peso{margin-top:2px;font-size:14px;color:var(--ink2)}
.amtbox.err{animation:shake .3s;outline:2px solid var(--danger)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lab{display:block;margin:16px 4px 8px;font-size:13px;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--paper);border:2px solid transparent;border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;color:var(--ink)}
.cat .ic{font-size:24px}
.cat.sel{background:var(--card);border-color:var(--accent);font-weight:700}
.field{width:100%;height:50px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.field:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:54px;border-radius:20px;font-size:17px;font-weight:700}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card)}
.btn.del{flex:0 0 54px;background:#f6e0dc;color:var(--danger);display:none;place-items:center;font-size:22px}
.btn.del.show{display:grid}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" id="logo"></div>
    <div class="titles"><h1>Cat Wallet</h1><p>your little money diary ♡</p></div>
    <button class="round" id="searchBtn" aria-label="Search"></button>
  </header>

  <div class="searchbar" id="searchBar">
    <input id="searchInput" type="search" placeholder="Search expenses…" autocomplete="off">
  </div>

  <section class="summary">
    <div class="monthrow">
      <button class="round" id="prev" aria-label="Previous month"></button>
      <div class="monthtxt"><small>Your expense diary</small><b id="monthLabel"></b></div>
      <button class="round" id="next" aria-label="Next month"></button>
    </div>
    <div class="totals">
      <div class="tot"><div class="lbl" id="lblVnd"></div><div class="val" id="totVnd"></div></div>
      <div class="tot"><div class="lbl" id="lblPhp"></div><div class="val" id="totPhp"></div></div>
    </div>
  </section>

  <div class="histhead">
    <div><h2>Expense History</h2><p>A little record of your spending ♡</p></div>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <div class="foot" id="foot"></div>
  <button class="rate" id="rateNote"></button>
</div>

<button class="fab" id="fab" aria-label="Add expense"></button>

<div class="overlay" id="overlay"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="grab"></div>
  <h3 id="sheetTitle">New expense</h3>

  <div class="amtbox" id="amtBox">
    <label for="amount">Amount in Vietnamese Dong</label>
    <div class="amtline"><span>₫</span><input id="amount" type="text" inputmode="numeric" placeholder="0" maxlength="14"></div>
    <div class="peso" id="pesoPreview">≈ ₱0.00</div>
  </div>

  <span class="lab">Category</span>
  <div class="cats" id="cats"></div>

  <span class="lab">Note (optional)</span>
  <input class="field" id="note" type="text" maxlength="40" placeholder="e.g. Pho bo, Grab ride">

  <span class="lab">Date &amp; time</span>
  <div class="two">
    <input class="field" id="date" type="date" required>
    <input class="field" id="time" type="time" required>
  </div>

  <div class="actions">
    <button type="button" class="btn del" id="delBtn" aria-label="Delete"></button>
    <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
    <button type="submit" class="btn primary" id="saveBtn">Save</button>
  </div>
</form>

<script>
(function(){
'use strict';

/* ---------- icons ---------- */
const I = (p,extra='') => `<svg class="ic" viewBox="0 0 24 24" ${extra}>${p}</svg>`;
const ICONS = {
  cat: I('<path d="M5 9V4l4 2.5a8 8 0 0 1 6 0L19 4v5c1.2 1.3 2 3 2 5 0 4-4 7-9 7s-9-3-9-7c0-2 .8-3.7 2-5z"/><path d="M10.4 16.6c.5.6 1 .8 1.6.8s1.1-.2 1.6-.8"/><circle cx="9" cy="12.5" r=".8" fill="currentColor"/><circle cx="15" cy="12.5" r=".8" fill="currentColor"/>'),
  search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  left: I('<path d="m15 18-6-6 6-6"/>'),
  right: I('<path d="m9 18 6-6-6-6"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  wallet: I('<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 13h.01"/>'),
  coins: I('<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.4 18.1"/><path d="M7 6h1v4"/><path d="m16.7 13.9.7.7-2.8 2.8"/>'),
  paw: I('<circle cx="6" cy="10" r="1.6"/><circle cx="10" cy="6" r="1.6"/><circle cx="15" cy="7" r="1.6"/><circle cx="18" cy="12" r="1.6"/><path d="M8.5 17c0-2.5 2-4.5 4-4.5s4 2 3.5 4.2c-.3 1.4-1.6 2-3 1.8-1.2-.2-1.7-.5-2.5-.2-.9.3-2 .2-2-1.3z"/>'),
  trash: I('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>')
};
const CATS = [
  {id:'food',label:'Food',icon:I('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>')},
  {id:'transpo',label:'Transpo',icon:I('<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>')},
  {id:'entertainment',label:'Entertainment',icon:I('<path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6C2.6 9.4 2 14.5 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.4-1.4a2 2 0 0 1 1.4-.6h4.4a2 2 0 0 1 1.4.6L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.5-.6-6.6-.7-7.4A4 4 0 0 0 17.3 5z"/>')},
  {id:'gift',label:'Gift',icon:I('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>')},
  {id:'load',label:'Load',icon:I('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>')},
  {id:'clothes',label:'Clothes',icon:I('<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.2a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.4-2.2z"/>')},
  {id:'health',label:'Health',icon:I('<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/><path d="M3.2 12h6.3l.5-1 2 4.5 2-7 1.5 3.5h5.3"/>')},
  {id:'bills',label:'Bills',icon:I('<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>')},
  {id:'other',label:'Other',icon:I('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>')}
];
const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];
const SHORT = {transpo:'Transpo', entertainment:'Entertainment'};

/* ---------- storage ---------- */
const KEY = 'catwallet.v1';
let db = {items:[], rate:0.0023};
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && Array.isArray(s.items)) db = {items:s.items, rate:+s.rate > 0 ? +s.rate : 0.0023};
} catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtVnd = n => '₫' + Math.round(n).toLocaleString('en-US');
const peso = vnd => vnd * db.rate;
const fmtPhp = n => '₱' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0,3));
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtTime(d){ let h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(d.getMinutes())} ${ap}`; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- state ---------- */
const now = new Date();
let vy = now.getFullYear(), vm = now.getMonth();
let query = '';
let editingId = null;
let selCat = 'food';

/* ---------- static icons ---------- */
$('logo').innerHTML = ICONS.cat;
$('searchBtn').innerHTML = ICONS.search;
$('prev').innerHTML = ICONS.left;
$('next').innerHTML = ICONS.right;
$('fab').innerHTML = ICONS.plus;
$('delBtn').innerHTML = ICONS.trash;
$('lblVnd').innerHTML = ICONS.wallet + '<span>Total in VND</span>';
$('lblPhp').innerHTML = ICONS.coins + '<span>Total in PHP</span>';
$('foot').innerHTML = ICONS.paw + '<span>Every little expense counts ♡</span>' + ICONS.paw;

/* ---------- render ---------- */
function render(){
  $('monthLabel').textContent = `${MONTHS[vm]} ${vy}`;
  $('next').disabled = (vy > now.getFullYear()) || (vy === now.getFullYear() && vm >= now.getMonth());

  const q = query.trim().toLowerCase();
  const items = db.items
    .filter(it => { const d = new Date(it.ts); return d.getFullYear() === vy && d.getMonth() === vm; })
    .sort((a,b) => b.ts - a.ts);

  const totalVnd = items.reduce((s,it) => s + it.vnd, 0);
  $('totVnd').textContent = fmtVnd(totalVnd);
  $('totPhp').textContent = fmtPhp(peso(totalVnd));

  const shown = q ? items.filter(it => (it.title + ' ' + catById(it.cat).label).toLowerCase().includes(q)) : items;
  $('count').textContent = `${shown.length} record${shown.length === 1 ? '' : 's'}`;

  if (!shown.length){
    $('list').innerHTML = `<div class="empty"><div class="big">${ICONS.paw}</div>${q ? 'No matching expenses' : 'No expenses yet this month.<br>Tap + to add your first one!'}</div>`;
  } else {
    const groups = [];
    shown.forEach(it => {
      const d = new Date(it.ts), k = dayKey(d);
      let g = groups[groups.length-1];
      if (!g || g.k !== k){ g = {k, d, rows:[]}; groups.push(g); }
      g.rows.push(it);
    });
    $('list').innerHTML = groups.map(g => `
      <div class="day"><span class="d">${MON[g.d.getMonth()]} ${g.d.getDate()}</span><span class="w">${DAYS[g.d.getDay()]}</span><span class="ln"></span></div>
      <div class="group">${g.rows.map(it => {
        const c = catById(it.cat);
        return `<button class="row" data-id="${it.id}">
          <div class="cico">${c.icon}</div>
          <div class="info">
            <div class="t">${esc(it.title)}</div>
            <div class="m">${esc(SHORT[c.id] || c.label)} · ${fmtTime(new Date(it.ts))}</div>
            <div class="p">${fmtPhp(peso(it.vnd))}</div>
          </div>
          <div class="amt">${fmtVnd(it.vnd)}</div>
        </button>`;
      }).join('')}</div>`).join('');
  }
  $('rateNote').textContent = `Currency conversion is an estimated rate of ₫1 = ₱${db.rate}. (tap to change)`;
}

/* ---------- sheet ---------- */
function drawCats(){
  $('cats').innerHTML = CATS.map(c => `<button type="button" class="cat ${c.id === selCat ? 'sel' : ''}" data-cat="${c.id}">${c.icon}<span>${c.label}</span></button>`).join('');
}
function updatePreview(){
  const v = parseInt($('amount').value.replace(/\D/g,'') || '0', 10);
  $('pesoPreview').textContent = '≈ ' + fmtPhp(peso(v));
}
function openSheet(id){
  editingId = id || null;
  const it = id ? db.items.find(x => x.id === id) : null;
  const d = it ? new Date(it.ts) : new Date();
  selCat = it ? it.cat : 'food';
  $('sheetTitle').textContent = it ? 'Edit expense' : 'New expense';
  $('amount').value = it ? it.vnd.toLocaleString('en-US') : '';
  $('note').value = it ? it.title : '';
  $('date').value = dayKey(d);
  $('time').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('delBtn').classList.toggle('show', !!it);
  $('amtBox').classList.remove('err');
  drawCats(); updatePreview();
  $('overlay').classList.add('open'); $('sheet').classList.add('open');
  if (!it) setTimeout(() => $('amount').focus(), 280);
}
function closeSheet(){
  $('overlay').classList.remove('open'); $('sheet').classList.remove('open');
  document.activeElement && document.activeElement.blur();
}

$('amount').addEventListener('input', e => {
  const digits = e.target.value.replace(/\D/g,'').replace(/^0+/,'');
  e.target.value = digits ? parseInt(digits,10).toLocaleString('en-US') : '';
  $('amtBox').classList.remove('err');
  updatePreview();
});
$('cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  selCat = b.dataset.cat; drawCats();
});
$('sheet').addEventListener('submit', e => {
  e.preventDefault();
  const vnd = parseInt($('amount').value.replace(/\D/g,'') || '0', 10);
  if (!vnd){ const b = $('amtBox'); b.classList.remove('err'); void b.offsetWidth; b.classList.add('err'); $('amount').focus(); return; }
  const [y,m,d] = $('date').value.split('-').map(Number);
  const [hh,mm] = ($('time').value || '00:00').split(':').map(Number);
  const ts = new Date(y, m-1, d, hh, mm).getTime();
  if (isNaN(ts)) return;
  const title = $('note').value.trim() || catById(selCat).label;
  if (editingId){
    const it = db.items.find(x => x.id === editingId);
    if (it) Object.assign(it, {vnd, cat:selCat, title, ts});
  } else {
    db.items.push({id:uid(), vnd, cat:selCat, title, ts});
  }
  save();
  const dt = new Date(ts); vy = dt.getFullYear(); vm = dt.getMonth();
  query = ''; $('searchInput').value = '';
  closeSheet(); render();
});
$('delBtn').addEventListener('click', () => {
  if (editingId && confirm('Delete this expense?')){
    db.items = db.items.filter(x => x.id !== editingId);
    save(); closeSheet(); render();
  }
});
$('cancelBtn').addEventListener('click', closeSheet);
$('overlay').addEventListener('click', closeSheet);
$('fab').addEventListener('click', () => openSheet());
$('list').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (r) openSheet(r.dataset.id);
});

/* ---------- nav / search / rate ---------- */
$('prev').addEventListener('click', () => { vm--; if (vm < 0){ vm = 11; vy--; } render(); });
$('next').addEventListener('click', () => { if ($('next').disabled) return; vm++; if (vm > 11){ vm = 0; vy++; } render(); });
$('searchBtn').addEventListener('click', () => {
  const bar = $('searchBar'); bar.classList.toggle('open');
  if (bar.classList.contains('open')) $('searchInput').focus();
  else { query = ''; $('searchInput').value = ''; render(); }
});
$('searchInput').addEventListener('input', e => { query = e.target.value; render(); });
$('rateNote').addEventListener('click', () => {
  const v = prompt('Peso per 1 Vietnamese dong (e.g. 0.0023):', db.rate);
  if (v === null) return;
  const n = parseFloat(v);
  if (n > 0 && n < 1){ db.rate = n; save(); render(); } else alert('Please enter a number like 0.0023');
});

/* ---------- offline support ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

render();
})();
</script>
</body>
</html>
